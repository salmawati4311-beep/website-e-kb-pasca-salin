  <!DOCTYPE html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-KB PASCA SALIN | Teman Ibu Mengenal KB</title>

<style>

:root {

  --pink: #f6b8c8;

  --pink-light: #fff0f4;

body {

  margin: 0;

  font-family: "T
  <!-- PIL KB -->
<div class="cards">

  <article class="card">
    <img class="method-photo"
      src="https://images.unsplash.com/photo-1607619056574-7b8d3ee536b2?auto=format&fit=crop&w=800&q=85"
      alt="Pil dan kemasan obat"
      loading="lazy">
    <div class="card-content">
      <span class="label">Kontrasepsi hormonal</span>
      <h3>💊 Pil KB</h3>
      <p>Pil KB diminum secara teratur untuk mencegah kehamilan. Terdapat pil kombinasi dan pil progestin saja.</p>
      <details class="details">
        <summary>Pelajari lebih lanjut</summary>
        <p><strong>Cara penggunaan:</strong> Minum sesuai jadwal dan petunjuk tenaga kesehatan. Aturan pil yang terlupa berbeda menurut jenis pil.</p>
        <p><strong>Hal yang perlu diperhatikan:</strong> Tanyakan jenis pil yang sesuai, terutama jika menyusui atau memiliki kondisi kesehatan tertentu.</p>
      </details>
    </div>
  </article>

  <!-- SUNTIK KB 1 BULAN -->
  <article class="card">
    <img class="method-photo"
      src="https://images.unsplash.com/photo-1583912267550-d5b9a3b3f5e5?auto=format&fit=crop&w=800&q=85"
      alt="Peralatan medis berupa suntikan"
      loading="lazy">
    <div class="card-content">
      <span class="label">Kontrasepsi hormonal</span>
      <h3>💉 Suntik KB 1 Bulan</h3>
      <p>Kontrasepsi suntik yang umumnya dijadwalkan setiap bulan. Jenis ini biasanya mengandung kombinasi hormon.</p>
      <details class="details">
        <summary>Pelajari lebih lanjut</summary>
        <p><strong>Cara penggunaan:</strong> Suntikan diberikan oleh tenaga kesehatan sesuai jadwal.</p>
        <p><strong>Hal yang perlu diperhatikan:</strong> Karena umumnya mengandung estrogen, metode ini tidak selalu menjadi pilihan awal pada masa menyusui. Tanyakan waktu penggunaan yang aman kepada bidan atau dokter.</p>
      </details>
    </div>
  </article>

  <!-- SUNTIK KB 3 BULAN -->
  <article class="card">
    <img class="method-photo"
      src="https://images.unsplash.com/photo-1615461066841-6116e61058f4?auto=format&fit=crop&w=800&q=85"
      alt="Perlengkapan medis"
      loading="lazy">
    <div class="card-content">
      <span class="label">Kontrasepsi hormonal</span>
      <h3>💉 Suntik KB 3 Bulan</h3>
      <p>Kontrasepsi hormonal yang umumnya diulang setiap tiga bulan, sesuai jenis sediaan dan jadwal dari tenaga kesehatan.</p>
      <details class="details">
        <summary>Pelajari lebih lanjut</summary>
        <p><strong>Kelebihan:</strong> Ibu tidak perlu minum pil setiap hari.</p>
        <p><strong>Efek yang mungkin terjadi:</strong> Perubahan pola menstruasi, termasuk menstruasi tidak teratur atau tidak menstruasi. Sebagian pengguna juga mengalami perubahan berat badan.</p>
        <p><strong>Saat menyusui:</strong> Waktu mulai penggunaannya perlu dinilai berdasarkan kondisi ibu dan pedoman yang berlaku.</p>
      </details>
    </div>
  </article>

  <!-- IMPLAN -->
  <article class="card">
    <img class="method-photo"
      src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Nexplanon.jpg/640px-Nexplanon.jpg"
      alt="Contoh alat kontrasepsi implan"
      loading="lazy">
    <div class="card-content">
      <span class="label">Jangka panjang</span>
      <h3>🌿 Implan</h3>
      <p>Batang kecil yang dipasang di bawah kulit lengan oleh tenaga kesehatan dan melepaskan hormon untuk mencegah kehamilan.</p>
      <details class="details">
        <summary>Pelajari lebih lanjut</summary>
        <p><strong>Kelebihan:</strong> Tidak perlu diingat setiap hari dan memberikan perlindungan jangka panjang sesuai jenis alat.</p>
        <p><strong>Hal yang perlu diperhatikan:</strong> Pola menstruasi dapat berubah. Pemasangan dan pelepasan harus dilakukan oleh tenaga kesehatan.</p>
      </details>
    </div>
  </article>

  <!-- IUD -->
  <article class="card">
    <img class="method-photo"
      src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Copper_IUD.jpg/640px-Copper_IUD.jpg"
      alt="Contoh alat kontrasepsi IUD tembaga"
      loading="lazy">
    <div class="card-content">
      <span class="label">Jangka panjang</span>
      <h3>🌸 IUD atau Spiral</h3>
      <p>Alat kecil yang dipasang di dalam rahim oleh tenaga kesehatan. Ada IUD tembaga dan IUD hormonal.</p>
      <details class="details">
        <summary>Pelajari lebih lanjut</summary>
        <p><strong>Kelebihan:</strong> Memberikan perlindungan jangka panjang tanpa perlu mengingat pil harian.</p>
        <p><strong>Hal yang perlu diperhatikan:</strong> Waktu pemasangan setelah persalinan harus ditentukan tenaga kesehatan. IUD tembaga dapat membuat menstruasi lebih banyak atau lebih nyeri pada sebagian pengguna.</p>
      </details>
    </div>
  </article>

  <!-- KONDOM -->
  <article class="card">
    <img class="method-photo"
      src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Condoms.jpg/640px-Condoms.jpg"
      alt="Contoh kondom dalam kemasan"
      loading="lazy">
    <div class="card-content">
      <span class="label">Tanpa hormon</span>
      <h3>💗 Kondom</h3>
      <p>Kondom digunakan pada penis saat berhubungan seksual sebagai penghalang agar sperma tidak masuk ke vagina.</p>
      <details class="details">
        <summary>Pelajari lebih lanjut</summary>
        <p><strong>Kelebihan:</strong> Tidak mengandung hormon dan membantu mengurangi risiko infeksi menular seksual jika digunakan dengan benar setiap kali berhubungan.</p>
        <p><strong>Cara penggunaan:</strong> Gunakan kondom baru setiap kali berhubungan dan ikuti petunjuk pada kemasan.</p>
      </details>
    </div>
  </article>

  <!-- METODE KALENDER -->
  <article class="card">
    <img class="method-photo"
      src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?auto=format&fit=crop&w=800&q=85"
      alt="Kalender untuk mencatat siklus menstruasi"
      loading="lazy">
    <div class="card-content">
      <span class="label">Metode alami</span>
      <h3>📅 Metode Kalender</h3>
      <p>Metode ini menggunakan catatan siklus menstruasi untuk memperkirakan masa subur.</p>
      <details class="details">
        <summary>Pelajari lebih lanjut</summary>
        <p><strong>Cara penggunaan:</strong> Catat siklus menstruasi secara konsisten dan pelajari cara memperkirakan masa subur dengan benar.</p>
        <p><strong>Hal yang perlu diperhatikan:</strong> Metode ini kurang sesuai jika siklus tidak teratur. Setelah persalinan, perubahan siklus dan menyusui dapat membuat perkiraan masa subur lebih sulit.</p>
      </details>
    </div>
  </article>

  <!-- MAL -->
  <article class="card">
    <img class="method-photo"
      src="https://images.unsplash.com/photo-1519689680058-324335c77eba?auto=format&fit=crop&w=800&q=85"
      alt="Ilustrasi foto keluarga dengan bayi"
      loading="lazy">
    <div class="card-content">
      <span class="label">Metode sementara</span>
      <h3>🤱 Metode Amenore Laktasi (MAL)</h3>
      <p>Metode kontrasepsi yang mengandalkan kondisi menyusui tertentu dan tidak berlaku untuk semua ibu menyusui.</p>
      <details class="details">
        <summary>Pelajari lebih lanjut</summary>
        <p>MAL hanya dapat diandalkan jika ketiga syarat terpenuhi: bayi berusia kurang dari enam bulan, menstruasi belum kembali, dan ibu menyusui penuh atau hampir penuh siang dan malam.</p>
        <p>Jika salah satu syarat tidak terpenuhi, diskusikan metode kontrasepsi lain dengan tenaga kesehatan.</p>
      </details>
    </div>
  </article>

</div>

<div class="notice">
  <strong>🌷 Catatan:</strong> Foto merupakan ilustrasi edukasi dan tidak menggantikan pemeriksaan alat atau konsultasi. Kesesuaian kontrasepsi harus dinilai berdasarkan kondisi masing-masing ibu.
</div>
</section>

<!-- KB SAAT MENYUSUI -->
<section class="soft-section" id="menyusui">
  <div class="section-heading">
    <span class="flower">🌷 ❀ 🌷</span>
    <h2>KB yang Dapat Dipertimbangkan Saat Menyusui</h2>
    <p>
      Ibu menyusui tetap dapat memilih kontrasepsi. Yang penting adalah
      mempertimbangkan jenis hormon, usia bayi, waktu setelah persalinan,
      dan kondisi kesehatan ibu.
    </p>
  </div>

  <div class="cards">
    <article class="card">
      <div class="card-content">
        <h3>🌿 Implan</h3>
        <p>Metode jangka panjang yang hanya perlu dipasang oleh tenaga kesehatan. Waktu pemasangan ditentukan berdasarkan kondisi ibu.</p>
      </div>
    </article>

    <article class="card">
      <div class="card-content">
        <h3>🌸 IUD</h3>
        <p>IUD tembaga tidak mengandung hormon. IUD hormonal juga dapat menjadi pilihan tertentu. Waktu pemasangan setelah melahirkan perlu dinilai tenaga kesehatan.</p>
      </div>
    </article>

    <article class="card">
      <div class="card-content">
        <h3>💉 Suntik KB 3 Bulan</h3>
        <p>Dapat dipertimbangkan bagi ibu menyusui, dengan penentuan waktu mulai berdasarkan kondisi ibu dan pedoman medis yang berlaku.</p>
      </div>
    </article>

    <article class="card">
      <div class="card-content">
        <h3>💊 Pil Progestin</h3>
        <p>Pil yang hanya mengandung progestin dapat menjadi pilihan bagi banyak ibu menyusui. Pilih jenis dan jadwal minum bersama tenaga kesehatan.</p>
      </div>
    </article>

    <article class="card">
      <div class="card-content">
        <h3>💗 Kondom</h3>
        <p>Metode tanpa hormon yang dapat digunakan saat menyusui dan membantu mengurangi risiko infeksi menular seksual.</p>
      </div>
    </article>
  </div>

  <div class="notice">
    <strong>Ingat, Ibu:</strong> Suntik KB 1 bulan umumnya mengandung estrogen sehingga perlu pertimbangan khusus saat menyusui. Jangan memilih atau mengganti metode hanya berdasarkan informasi di website.
  </div>
</section>

<!-- EFEK SAMPING -->
<section id="efek">
  <div class="section-heading">
    <span class="flower">✿ ❀ ✿</span>
    <h2>Mengenal Efek Samping KB</h2>
    <p>
      Perubahan tubuh tidak selalu berarti ada masalah, tetapi setiap keluhan
      perlu dipahami berdasarkan metode yang digunakan.
    </p>
  </div>

  <div class="cards">
    <article class="card">
      <div class="card-content">
        <h3>🩷 Perubahan Menstruasi</h3>
        <p>Beberapa metode hormonal dapat menyebabkan bercak darah, menstruasi tidak teratur, lebih sedikit, atau tidak menstruasi.</p>
      </div>
    </article>

    <article class="card">
      <div class="card-content">
        <h3>🌼 Perubahan Berat Badan</h3>
        <p>Sebagian pengguna mengalami perubahan berat badan. Penyebabnya dapat beragam dan tidak selalu karena kontrasepsi.</p>
      </div>
    </article>

    <article class="card">
      <div class="card-content">
        <h3>🌷 Keluhan Lain</h3>
        <p>Sakit kepala, nyeri payudara, atau keluhan lain dapat terjadi pada sebagian pengguna, tergantung jenis kontrasepsinya.</p>
      </div>
    </article>
  </div>

  <div class="notice">
    Jika mengalami perdarahan sangat banyak, nyeri hebat, sesak napas, atau keluhan berat lainnya, segera cari pertolongan medis.
  </div>
</section>

<!-- PANDUAN IBU -->
<section class="soft-section" id="bantuan">
  <div class="section-heading">
    <span class="flower">🌷</span>
    <h2>Yuk, Siapkan Pertanyaan untuk Bidan</h2>
    <p>
      Jawab pertanyaan berikut untuk membantu mengenali informasi yang perlu
      Ibu diskusikan. Hasilnya tidak memilihkan metode kontrasepsi secara otomatis.
    </p>
  </div>

  <div class="card">
    <div class="card-content">
      <label for="usiaBayi"><strong>1. Berapa usia bayi Ibu?</strong></label>
      <select id="usiaBayi">
        <option value="">Pilih usia bayi</option>
        <option value="0-6">0–6 bulan</option>
        <option value="7-12">7–12 bulan</option>
        <option value="lebih12">Lebih dari 12 bulan</option>
      </select>

      <label for="statusMenyusui"><strong>2. Apakah Ibu sedang menyusui?</strong></label>
      <select id="statusMenyusui">
        <option value="">Pilih jawaban</option>
        <option value="eksklusif">Ya, ASI eksklusif</option>
        <option value="campuran">Ya, ASI dan makanan/minuman lain</option>
        <option value="tidak">Tidak menyusui</option>
      </select>

      <label for="kebutuhan"><strong>3. Informasi apa yang Ibu butuhkan?</strong></label>
      <select id="kebutuhan">
        <option value="">Pilih kebutuhan informasi</option>
        <option value="menunda">Menunda kehamilan</option>
        <option value="jangka">Kontrasepsi jangka panjang</option>
        <option value="hormonal">Memahami metode hormonal</option>
        <option value="efek">Memahami efek samping</option>
        <option value="alami">Metode alami dan kalender</option>
      </select>

      <label for="catatan"><strong>4. Pertanyaan Ibu (opsional)</strong></label>
      <textarea id="catatan" rows="4" placeholder="Contoh: Saya menyusui bayi usia 2 bulan dan ingin mengetahui pilihan KB."></textarea>

      <button class="btn" type="button" onclick="buatRingkasan()">Lihat Ringkasan Informasi</button>

      <div id="hasil" class="notice" style="display:none" aria-live="polite"></div>
    </div>
  </div>
</section>

<section>
  <div class="section-heading">
    <span class="flower">💗</span>
    <h2>Ibu Berhak Mendapatkan Informasi yang Jelas</h2>
    <p>
      Bicarakan kebutuhan dan kekhawatiran Ibu dengan bidan atau dokter.
      Pilihan kontrasepsi sebaiknya dibuat bersama tenaga kesehatan
      berdasarkan kondisi dan keinginan Ibu.
    </p>
  </div>
</section>

<script>
function buatRingkasan() {
  const usia = document.getElementById("usiaBayi").value;
  const menyusui = document.getElementById("statusMenyusui").value;
  const kebutuhan = document.getElementById("kebutuhan").value;
  const catatan = document.getElementById("catatan").value.trim();
  const hasil = document.getElementById("hasil");

  if (!usia || !menyusui || !kebutuhan) {
    hasil.style.display = "block";
    hasil.textContent =
      "Silakan lengkapi pilihan usia bayi, status menyusui, dan kebutuhan informasi.";
    return;
  }

  let pesan = "";

  if (usia === "0-6") {
    pesan += "Bayi berusia 0–6 bulan. Bicarakan waktu mulai kontrasepsi dengan bidan, terutama jika sedang menyusui. ";
  } else if (usia === "7-12") {
    pesan += "Bayi berusia 7–12 bulan. Tinjau pilihan kontrasepsi berdasarkan kondisi ibu dan rencana kehamilan. ";
  } else {
    pesan += "Bayi berusia lebih dari 12 bulan. Pilihan kontrasepsi tetap perlu disesuaikan dengan kesehatan dan kebutuhan ibu. ";
  }

  if (menyusui === "eksklusif") {
    pesan += "MAL hanya dapat diandalkan bila bayi berusia kurang dari enam bulan, menstruasi belum kembali, dan menyusui penuh atau hampir penuh siang dan malam. ";
  } else if (menyusui === "campuran") {
    pesan += "Jika menyusui tidak penuh, jangan mengandalkan menyusui saja untuk mencegah kehamilan. ";
  } else {
    pesan += "Walaupun tidak menyusui, waktu setelah persalinan dan kondisi kesehatan tetap perlu dipertimbangkan. ";
  }

  const pilihan = {
    menunda: "Diskusikan pilihan untuk menunda kehamilan dan berapa lama perlindungan yang diinginkan.",
    jangka: "Tanyakan tentang implan dan IUD, termasuk manfaat, risiko, dan waktu pemasangan.",
    hormonal: "Tanyakan perbedaan pil, suntik 1 bulan, suntik 3 bulan, serta pengaruhnya terhadap menstruasi dan menyusui.",
    efek: "Tanyakan efek samping yang mungkin terjadi, tanda bahaya, dan kapan harus kembali ke fasilitas kesehatan.",
    alami: "Tanyakan keterbatasan metode kalender dan syarat penggunaan metode amenore laktasi."
  };

  pesan += pilihan[kebutuhan];

  if (catatan) {
    pesan += " Catatan pertanyaan Ibu: " + catatan;
  }

  pesan += " Ringkasan ini merupakan panduan edukasi, bukan diagnosis atau rekomendasi metode individual. Konsultasikan pilihan dengan bidan atau dokter.";

  hasil.style.display = "block";
  hasil.textContent = pesan;
}
</script>
